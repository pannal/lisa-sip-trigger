name: Test and build

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  container:
    needs: tests
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'pannal/lisa-sip-trigger' }}
    steps:
      - uses: actions/checkout@v6
      - name: Select registry publishing or local archive
        id: publishing
        env:
          RELEASE_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          release = os.environ['RELEASE_PUSH'] == 'true'
          configured = bool(os.environ['DOCKERHUB_USERNAME'] and os.environ['DOCKERHUB_TOKEN'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'enabled={str(release and configured).lower()}', file=output)
          if release and not configured:
              print('::warning::Docker Hub publication skipped: DOCKERHUB_USERNAME and/or '
                    'DOCKERHUB_TOKEN is missing. Building a downloadable OCI archive only.')
          elif release:
              print('Docker Hub credentials configured; this release will be published after tests and build succeed.')
          else:
              print('Pull request or branch build: no Docker Hub login or push; exporting an OCI archive.')
          PY
      - name: Validate release configuration
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Only stable vX.Y.Z releases are supported')
          image = os.environ['IMAGE']
          if not re.fullmatch(r'[a-z0-9_-]+/[a-z0-9._-]+', image):
              raise SystemExit('Set the DOCKERHUB_IMAGE repository variable to namespace/lisa-sip-trigger')
          PY
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Test inside both container architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=lisa-test
          cache-to: type=gha,mode=max,scope=lisa-test
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}},priority=900
            type=semver,pattern={{major}}.{{minor}},priority=800
            type=semver,pattern={{major}},priority=700
            type=sha
          labels: |
            org.opencontainers.image.title=lisa-sip-trigger
            org.opencontainers.image.description=Trigger legacy Humantechnik LISA radio alerts through a SIP FXS adapter
            org.opencontainers.image.licenses=MIT
      - name: Log in to Docker Hub for releases only
        if: steps.publishing.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image; publish releases only
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publishing.outputs.enabled == 'true' }}
          outputs: ${{ steps.publishing.outputs.enabled != 'true' && format('type=oci,dest={0}/lisa-sip-trigger.oci.tar', runner.temp) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lisa-runtime
          cache-to: type=gha,mode=max,scope=lisa-runtime
      - name: Save image archive for review
        if: steps.publishing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lisa-sip-trigger-oci
          path: ${{ runner.temp }}/lisa-sip-trigger.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Report image result
        env:
          PUBLISHED: ${{ steps.publishing.outputs.enabled }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['PUBLISHED'] == 'true':
              result = 'Published the linux/amd64 and linux/arm64 image to Docker Hub.'
          else:
              result = ('Docker Hub image NOT published. The linux/amd64 and linux/arm64 '
                        'OCI archive is available as the lisa-sip-trigger-oci artifact for 14 days.')
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print(result, file=summary)
              print('\nGenerated image tags (pushed only when published):\n', file=summary)
              print('```\n' + os.environ['IMAGE_TAGS'] + '\n```', file=summary)
          PY
