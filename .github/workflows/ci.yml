name: Test and build

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  container:
    needs: tests
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'dockerhub-user/lisa-sip-trigger' }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate release configuration
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Only stable vX.Y.Z releases are supported')
          image = os.environ['IMAGE']
          if image.startswith('dockerhub-user/') or not re.fullmatch(r'[a-z0-9_-]+/[a-z0-9._-]+', image):
              raise SystemExit('Set the DOCKERHUB_IMAGE repository variable to namespace/lisa-sip-trigger')
          PY
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Test inside both container architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=lisa-test
          cache-to: type=gha,mode=max,scope=lisa-test
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.title=lisa-sip-trigger
            org.opencontainers.image.description=Trigger legacy Humantechnik LISA radio alerts through a SIP FXS adapter
            org.opencontainers.image.licenses=MIT
      - name: Log in to Docker Hub for releases only
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image; publish releases only
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
          outputs: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=oci,dest={0}/lisa-sip-trigger.oci.tar', runner.temp) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lisa-runtime
          cache-to: type=gha,mode=max,scope=lisa-runtime
      - name: Save image archive for review
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: lisa-sip-trigger-oci
          path: ${{ runner.temp }}/lisa-sip-trigger.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
